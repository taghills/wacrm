name: Send due review requests

# Nothing inside the app is scheduled, and this deployment (Hostinger's
# Node app hosting) has no cron of its own. So the clock lives here.
#
# `order.delivered` queues a row in erp_review_queue due a few days
# out; this calls the drain that sends them. Once a day is enough —
# the delay is measured in days, so a row due today goes out on
# whichever run happens next.
#
# 03:30 UTC is 09:00 in India: a review request should arrive during
# shop hours, not at midnight.
#
# GitHub delays scheduled runs under load. On this repository the
# observed delay has been SIX TO SEVEN HOURS, every day, not the tens
# of minutes the docs suggest: nominal 03:30 UTC has fired at 10:00,
# 10:10, 10:45, 10:46 and 11:07. So review requests have been arriving
# around 16:00 IST rather than 09:00.
#
# The minute is off :30 and :00 because those are the congested ones —
# everybody schedules there. It may not help much; the delay is
# GitHub's to give.
#
# The nominal time stays in the MORNING rather than being wound back
# to compensate. A run that is not delayed sends immediately, so
# scheduling at 21:00 UTC to land at 09:00 IST would message customers
# at 02:30 IST on any day GitHub happens to be on time. Both ends of
# the current range — 09:00 IST on time, ~16:00 IST delayed — are
# inside shop hours. Guessing at the delay is not.
#
# Caveat worth knowing: GitHub disables scheduled workflows in a
# repository with no activity for 60 days, and says so by email. If
# review requests ever stop, check that this workflow is still
# enabled before looking anywhere else — /api/erp/status will show
# the queue going overdue.

on:
  schedule:
    - cron: '7 3 * * *'
  # So you can run it by hand from the Actions tab to test it, without
  # waiting for tomorrow.
  workflow_dispatch:

jobs:
  drain:
    name: Drain the review queue
    runs-on: ubuntu-latest
    # Three attempts at up to five minutes each, plus the waits
    # between. Bounded so a wedged request cannot sit on a runner.
    timeout-minutes: 20

    steps:
      - name: Call the review cron
        env:
          # Must match AUTOMATION_CRON_SECRET in the app's own
          # environment. Stored as a repository secret, so it is never
          # printed in a log.
          CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::AUTOMATION_CRON_SECRET is not set as a repository secret."
            echo "Add it under Settings -> Secrets and variables -> Actions,"
            echo "with the same value the app has in its own environment."
            exit 1
          fi

          # -sS keeps curl quiet but still prints real errors.
          # The body and status are captured separately so a failure
          # reports what the endpoint actually said.
          #
          # The retries are not belt-and-braces. On 11 Oct 2026 this
          # job failed with
          #   curl: (28) Failed to connect to wa.taghills.com port 443
          # after the host was unreachable for 4.5 minutes, and every
          # review request due that day waited until the next run —
          # a day late, for a blip. Draining is idempotent (a row is
          # claimed before it is sent), so a retry cannot double-send.
          #
          # --max-time is per attempt, and --retry-connrefused covers
          # the refused-connection case curl does not count as
          # transient by default.
          response=$(mktemp)
          status=$(curl -sS -o "${response}" -w '%{http_code}' \
            --max-time 300 \
            --retry 2 \
            --retry-delay 30 \
            --retry-connrefused \
            -H "x-cron-secret: ${CRON_SECRET}" \
            https://wa.taghills.com/api/erp/review/cron)

          body=$(cat "${response}")
          echo "HTTP ${status}"
          echo "${body}"

          case "${status}" in
            200)
              # e.g. {"sent":2,"skipped":0,"failed":0}
              echo "::notice::Review queue drained: ${body}"
              ;;
            401)
              echo "::error::The secret here does not match the app's AUTOMATION_CRON_SECRET."
              exit 1
              ;;
            503)
              echo "::error::The app has no AUTOMATION_CRON_SECRET set, so the endpoint is switched off. Set it in the hosting environment and redeploy."
              exit 1
              ;;
            *)
              # A failing job emails you. That is the point: a delayed
              # message that never sends is otherwise silent.
              echo "::error::Unexpected response ${status} from the review cron."
              exit 1
              ;;
          esac
